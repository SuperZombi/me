<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { margin: 0; height: 100%; }
body {
	height: 100dvh;
	background: linear-gradient(135deg, #1e1e2f, #2a2a40);
	font-family: sans-serif;
	overflow: hidden;
	color: #eee;
	color-scheme: dark;
}
.screen {
	display: none;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	height: 100%;
	padding: 0 1rem;
	box-sizing: border-box;
	text-align: center;
}
.screen.active { display: flex; }
h2 { margin: 0 0 1rem; user-select: none; }
p { margin: 0 0 1rem; font-size: 1.1rem; opacity: .85; }
img { height: 200px; padding-bottom: 2rem; user-select: none; pointer-events: none; }
#when img { height: 180px; padding-bottom: 1.5rem; }

.buttons-area { display: flex; gap: 1rem; align-items: center; }
.slot { display: inline-block; }

.btn {
	padding: 1rem 2.5rem;
	font-size: 1rem;
	text-transform: uppercase;
	color: white;
	border: none;
	border-radius: 12px;
	background: linear-gradient(45deg, #1cb0f6, #039be5, #5468ff);
	background-size: 200% 200%;
	transition: all 0.3s ease;
	box-shadow: 0 8px 20px rgba(0,0,0,0.3);
	user-select: none;
	font-weight: bold;
	cursor: pointer;
}
.btn:hover:not(:disabled) {
	background-position: right center;
	transform: translateY(-3px) scale(1.03);
	box-shadow: 0 12px 30px rgba(0,0,0,0.4);
}
.btn:active:not(:disabled) { transform: scale(0.97); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
a.btn { display: inline-block; text-decoration: none; }
#no.free { position: fixed; cursor: default; }

.picker { display: flex; flex-direction: column; gap: 1rem; align-items: center; margin-bottom: 2rem; }
input[type=date], input[type=time] {
	font: inherit; font-size: 1.1rem; padding: .8rem 1rem;
	color: #eee; background: #2f2f48; border: 2px solid #44446a; border-radius: 12px;
}
:focus-visible { outline: 3px solid #1cb0f6; outline-offset: 2px; }
</style>
</head>
<body>

<section class="screen active" id="invite">
	<h2>Will you go out with me?</h2>
	<img src="waiting.gif" draggable="false">
	<div class="buttons-area">
		<button class="btn" id="yes">Yes</button>
		<div class="slot" id="noSlot"><button class="btn" id="no">No</button></div>
	</div>
</section>

<section class="screen" id="when">
	<h2>Good choice!</h2>
	<h2>When are you free?</h2>
	<img src="time.gif" draggable="false">
	<div class="picker">
		<input type="date" id="date" aria-label="Date">
		<input type="time" id="time" aria-label="Time">
	</div>
	<div class="buttons-area">
		<button class="btn" id="confirm" disabled>Confirm</button>
	</div>
</section>

<section class="screen" id="done">
	<h2>It's a date!</h2>
	<img src="pizza.gif" draggable="false">
	<p id="summary"></p>
	<p>See you there!</p>
	<a class="btn" id="gcal" target="_blank" rel="noopener">Add to Calendar</a>
</section>

<script>
	const $ = s => document.querySelector(s)
	const screens = [...document.querySelectorAll(".screen")]

	// Switch between screens by id: "invite" -> "when" -> "done"
	function showScreen(id) {
		screens.forEach(s => s.classList.toggle("active", s.id === id))
		resetNo()
	}

	/* ---------- Screen 1: runaway "No" button ---------- */
	const yes = $("#yes"), no = $("#no"), slot = $("#noSlot")

	function resetNo() {
		no.classList.remove("free")
		no.style.left = no.style.top = ""
	}

	function moveNo(e) {
		const p = e.touches?.[0] ?? e
		if (!no.classList.contains("free")) {
			// Keep the button's space in the layout so nothing shifts
			const r = no.getBoundingClientRect()
			slot.style.width = r.width + "px"
			slot.style.height = r.height + "px"
			no.style.left = r.left + "px"
			no.style.top = r.top + "px"
			no.classList.add("free")
		}
		const w = no.offsetWidth, h = no.offsetHeight, m = 8, gap = 50
		const y = yes.getBoundingClientRect() // measured live, never stale
		let x1, y1
		for (let i = 0; i < 30; i++) {
			x1 = m + Math.random() * (window.innerWidth - w - 2 * m)
			y1 = m + Math.random() * (window.innerHeight - h - 2 * m)
			const far = Math.hypot(x1 + w / 2 - (p.clientX ?? 0), y1 + h / 2 - (p.clientY ?? 0)) > 100
			const hitsYes = !(x1 + w + gap < y.left || x1 > y.right + gap ||
			                  y1 + h + gap < y.top || y1 > y.bottom + gap)
			if (far && !hitsYes) break
		}
		no.style.left = x1 + "px"
		no.style.top = y1 + "px"
	}

	no.addEventListener("pointerenter", moveNo)
	no.addEventListener("click", moveNo)
	window.addEventListener("resize", resetNo)
	yes.addEventListener("click", () => showScreen("when"))

	/* ---------- Screen 2: date & time ---------- */
	const dateInput = $("#date"), confirmBtn = $("#confirm")
	const today = new Date()
	dateInput.min = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, "0"),
	                 String(today.getDate()).padStart(2, "0")].join("-")

	const timeInput = $("#time")
	function validate() { confirmBtn.disabled = !(dateInput.value && timeInput.value) }
	dateInput.addEventListener("input", validate)
	timeInput.addEventListener("input", validate)

	/* ---------- Screen 3: confirmation ---------- */
	confirmBtn.addEventListener("click", () => {
		const [y, m, d] = dateInput.value.split("-").map(Number)
		const day = new Date(y, m - 1, d).toLocaleDateString("en-US",
			{ weekday: "long", month: "long", day: "numeric" })
		const [hh, mm] = timeInput.value.split(":")
		$("#summary").textContent = `${day} at ${timeInput.value}.`

		// Google Calendar link (event lasts 2 hours, in the viewer's own time zone)
		const pad = n => String(n).padStart(2, "0")
		const fmt = t => `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}T${pad(t.getHours())}${pad(t.getMinutes())}00`

		const start = new Date(y, m - 1, d, +hh, +mm)
		const end = new Date(start.getTime() + 2 * 60 * 60 * 1000)
		$("#gcal").href = "https://calendar.google.com/calendar/render?" + new URLSearchParams({
			action: "TEMPLATE",
			text: "Our date",
			dates: `${fmt(start)}/${fmt(end)}`,
			details: "Looking forward to it!"
		})
		showScreen("done")
	})
</script>
</body>
</html>
